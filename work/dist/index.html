  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <link rel="preload" as="font" type="font/ttf" crossorigin href="assets/fonts/NotoSansArabic-Regular.ttf">
  <link rel="stylesheet" href="css/styles.css?v=0.6.0-alpha-10-v2g">
  <title>مدرّب المقابلات القيادية</title>

<body>
  <a class="skip-link" href="#main-content">انتقل إلى المحتوى</a>

  <header class="app-header" id="app-header" hidden>
    <div class="header-inner">
      <button class="icon-button back-button" id="back-button" type="button" aria-label="العودة إلى الصفحة السابقة" title="رجوع" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <a class="route-brand" href="#/home" aria-label="العودة إلى الرئيسية">
        <strong id="route-title">مدرّب المقابلات</strong>
      </a>
      <span class="header-spacer" aria-hidden="true"></span>
    </div>
  </header>

  <main id="main-content" class="app-main" tabindex="-1">
    <section class="loading-screen" aria-live="polite">
      <span class="loader" aria-hidden="true"></span>
      <p>جارٍ تجهيز المرجع…</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3V11Z"/></svg><small>الرئيسية</small></a>
    <a href="#/preparation" data-nav="preparation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H12v18H7.5A3.5 3.5 0 0 0 4 23V5.5ZM20 5.5A3.5 3.5 0 0 0 16.5 2H12v18h4.5A3.5 3.5 0 0 1 20 23V5.5Z"/></svg><small>التحضير</small></a>
    <a href="#/simulation" data-nav="simulation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Zm-7-4a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg><small>المحاكاة</small></a>
    <a href="#/reports" data-nav="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM9 16v-4M12 16V8M15 16v-6"/></svg><small>التقارير</small></a>
    <a href="#/settings" data-nav="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><small>المزيد</small></a>

  <dialog id="app-dialog" class="app-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <h2 id="dialog-title">تفاصيل</h2>
        <button class="icon-button" value="cancel" aria-label="إغلاق">×</button>
      </div>
      <div id="dialog-content" class="dialog-content"></div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/boot.js?v=0.6.0-alpha-10-v2g" data-app="js/app.js?v=0.6.0-alpha-10-v2g" data-cache="leadership-interview-coach-v0.6.0-alpha-10.2-51d413de-v2g"></script>

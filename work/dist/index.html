<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5b57">
  <meta name="description" content="مدرّب عربي للمقابلات القيادية المبنية على الكفاءات">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مدرّب المقابلات">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=0.5.1">
  <title>مدرّب المقابلات القيادية</title>
</head>
<body>
  <a class="skip-link" href="#main-content">انتقل إلى المحتوى</a>

  <header class="app-header" id="app-header">
    <div class="header-inner">
      <button class="icon-button back-button" id="back-button" type="button" aria-label="العودة إلى الصفحة السابقة" title="رجوع" hidden>‹</button>
      <a class="brand" href="#/home" aria-label="الرئيسية">
        <span class="brand-mark" aria-hidden="true">ق</span>
        <span class="brand-copy">
          <strong>مدرّب المقابلات</strong>
          <small>مراجعة المقابلات القيادية</small>
        </span>
      </a>
      <div class="header-actions">
        <a class="icon-button search-button" href="#/search" aria-label="البحث في المرجع" title="البحث">⌕</a>
        <a class="icon-button settings-button" href="#/settings" aria-label="إعدادات التطبيق" title="الإعدادات">⚙</a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="تبديل مظهر التطبيق" title="تبديل المظهر">◐</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="app-main" tabindex="-1">
    <section class="loading-screen" aria-live="polite">
      <span class="loader" aria-hidden="true"></span>
      <p>جارٍ تجهيز المرجع…</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <a href="#/home" data-nav="home"><span aria-hidden="true">⌂</span><small>الرئيسية</small></a>
    <a href="#/learn" data-nav="learn"><span aria-hidden="true">▥</span><small>المسار</small></a>
    <a href="#/bank" data-nav="bank"><span aria-hidden="true">▤</span><small>الأسئلة</small></a>
    <a href="#/tools" data-nav="tools"><span aria-hidden="true">▣</span><small>الأدوات</small></a>
  </nav>

  <dialog id="app-dialog" class="app-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <h2 id="dialog-title">تفاصيل</h2>
        <button class="icon-button" value="cancel" aria-label="إغلاق">×</button>
      </div>
      <div id="dialog-content" class="dialog-content"></div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js?v=0.5.1"></script>
</body>
</html>
